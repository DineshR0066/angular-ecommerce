<div class="modal-overlay" (click)="onClose()">
  <div class="modal-content" (click)="$event.stopPropagation()">
    <div class="modal-header">
      <h2>Edit Profile</h2>
    </div>

    <form [formGroup]="editForm" (ngSubmit)="onSubmit()">
      <div class="form-section">
        <div class="input-group">
          <label>Current Password</label>
          <div class="password-input">
            <input 
              [type]="showCurrentPassword ? 'text' : 'password'" 
              formControlName="currentPassword" 
              placeholder="Current Password"
            >
            <button type="button" class="toggle-password" (click)="toggleCurrentPassword()">
              @if(!showCurrentPassword){
                <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 12s3-7 10-7 10 7 10 7-3 7-10 7-10-7-10-7Z"/><circle cx="12" cy="12" r="3"/></svg>
              }
              @else{
                <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9.88 9.88a3 3 0 1 0 4.24 4.24"/><path d="M10.73 5.08A10.43 10.43 0 0 1 12 5c7 0 10 7 10 7a13.16 13.16 0 0 1-1.67 2.68"/><path d="M6.61 6.61A13.52 13.52 0 0 0 2 12s3 7 10 7a9.74 9.74 0 0 0 5.39-1.61"/><line x1="2" y1="2" x2="22" y2="22"/></svg>
              }
            </button>
          </div>
        </div>

        <div class="input-group">
          <label>New Password</label>
          <div class="password-input">
            <input 
              [type]="showNewPassword ? 'text' : 'password'" 
              formControlName="newPassword" 
              placeholder="New Password"
            >
            <button type="button" class="toggle-password" (click)="toggleNewPassword()">
              @if(!showNewPassword){
                <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 12s3-7 10-7 10 7 10 7-3 7-10 7-10-7-10-7Z"/><circle cx="12" cy="12" r="3"/></svg>
              }
              @else{
                <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9.88 9.88a3 3 0 1 0 4.24 4.24"/><path d="M10.73 5.08A10.43 10.43 0 0 1 12 5c7 0 10 7 10 7a13.16 13.16 0 0 1-1.67 2.68"/><path d="M6.61 6.61A13.52 13.52 0 0 0 2 12s3 7 10 7a9.74 9.74 0 0 0 5.39-1.61"/><line x1="2" y1="2" x2="22" y2="22"/></svg>
              }
            </button>
          </div>
        </div>
      </div>

      <div class="divider">
        <span>Addresses</span>
      </div>

      <div class="form-section">
        <h3>Add New Address</h3>
        <div class="input-group">
          <label>Address</label>
          <textarea formControlName="address" placeholder="Address"></textarea>
        </div>
        <div class="grid-2">
          <div class="input-group">
            <label>City</label>
            <input type="text" formControlName="city" placeholder="City">
          </div>
          <div class="input-group">
            <label>State</label>
            <input type="text" formControlName="state" placeholder="State">
          </div>
        </div>
        <div class="input-group">
          <label>Zip Code</label>
          <input type="text" formControlName="zip_code" placeholder="Zip Code">
        </div>
      </div>

      <div class="modal-footer">
        <app-button type="button" variant="secondary" (btnClick)="onClose()">Cancel</app-button>
        <app-button type="submit" variant="primary">Save</app-button>
      </div>
    </form>
  </div>
</div>
