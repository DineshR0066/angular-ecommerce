<div class="modal-overlay" (click)="onClose()">
  <div class="modal-container" (click)="$event.stopPropagation()">
    <div class="modal-header">
      <h2>Product Details</h2>
    </div>

    <div class="modal-body">
      <div class="product-image-container">
        <img [src]="product().product_image_url" [alt]="product().product_name">
      </div>

      <div class="product-info">
        <div class="info-group">
          <label>CATEGORY</label>
          <p>{{ product().product_category_name }}</p>
        </div>

        <div class="info-group">
          <label>NAME</label>
          <p class="product-name">{{ product().product_name }}</p>
        </div>

        <div class="info-group">
          <label>PRICE</label>
          <p class="product-price">₹{{ product().price }}</p>
        </div>

        <div class="info-group">
          <label>AVAILABILITY</label>
          <p class="product-stock" [class.low-stock]="product().product_qty < 10">
            In Stock: {{ product().product_qty }}
          </p>
        </div>
      </div>
    </div>

    <div class="modal-footer">
      <app-button variant="danger" (btnClick)="onClose()">Close</app-button>
      
      <div class="action-buttons">
        <app-button variant="teal" (btnClick)="onAddToCart()">
          <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="8" cy="21" r="1"/><circle cx="19" cy="21" r="1"/><path d="M2.05 2.05h2l2.66 12.42a2 2 0 0 0 2 1.58h9.78a2 2 0 0 0 1.95-1.57l1.65-7.43H5.12"/></svg>
          Add to Cart
        </app-button>
        <app-button variant="light-blue" (btnClick)="onBuyNow()">
          <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 2 3 6v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6l-3-4Z"/><path d="M3 6h18"/><path d="M16 10a4 4 0 0 1-8 0"/></svg>
          Buy Now
        </app-button>
      </div>
    </div>
  </div>
</div>
