<button 
  [type]="type()" 
  [disabled]="disabled() || loading()"
  [class]="'btn btn-' + variant() + ' btn-' + size()"
  [class.loading]="loading()"
  (click)="onClick($event)"
>
  @if (loading()) {
    <span class="spinner"></span>
  }
  <span class="content">
    <ng-content></ng-content>
  </span>
</button>
